name: Deploy карманного свода

# Публикует папку docs/ на GitHub Pages через Actions.
# Источник Pages: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить, что страница собрана из markdown
        run: |
          python3 build_site.py
          if ! git diff --quiet -- docs/index.html; then
            echo "::error::docs/index.html устарел. Локально: python3 build_site.py && git commit docs/index.html"
            git diff --stat -- docs/index.html
            exit 1
          fi
          test -f docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
