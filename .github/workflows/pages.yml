name: Deploy карманного свода

# Публикует папку docs/ на GitHub Pages через Actions.
# Источник Pages: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # достаточно поправить markdown и запушить: страница соберётся здесь,
      # версия офлайн-кэша в sw.js обновится автоматически (Pillow не нужен)
      - name: Пересобрать страницу из markdown
        run: python3 build_site.py

      # Публикуем только открытый семейный контур. Родительские методики
      # требуют серверного входа и в артефакт Pages не попадают.
      - name: Собрать открытый семейный справочник
        run: python3 -m family.build_public

      - name: Что изменилось после пересборки
        run: |
          git --no-pager diff --stat -- docs
          test -f docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Дымовой тест: адрес должен отдавать страницу свода (а не README и не 404).
      # Если в настройках Pages когда-нибудь снова окажется другой источник, деплой
      # упадёт здесь, а не через неделю молчания.
      - name: Проверить, что сайт отдаёт страницу свода
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 18); do
            code=$(curl -sL -o /tmp/site.html -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ] && grep -q 'class="pane pane--home"' /tmp/site.html \
               && grep -q 'id="p1"' /tmp/site.html; then
              echo "OK: $URL — $(wc -c < /tmp/site.html) байт, $(grep -c '<details' /tmp/site.html) карточек"
              grep -o '<title>[^<]*</title>' /tmp/site.html
              exit 0
            fi
            echo "попытка $i: код $code — ждём публикацию (10 с)"
            sleep 10
          done
          echo "::error::по адресу $URL нет страницы свода"
          head -c 400 /tmp/site.html || true
          exit 1

      - name: Проверить закрытый раздел «Родителям»
        run: |
          URL="${{ steps.deployment.outputs.page_url }}semya.html"
          code=$(curl -sL -o /tmp/semya.html -w "%{http_code}" "$URL" || echo 000)
          echo "код $code, $(wc -c < /tmp/semya.html) байт"
          test "$code" = "200" || { echo "::error::закрытый раздел не отдаётся"; exit 1; }
          grep -q 'id="gate"' /tmp/semya.html || { echo "::error::нет формы входа"; exit 1; }
          if grep -q 'Папе и маме' /tmp/semya.html; then
            echo "::error::в опубликованной странице открытый текст"; exit 1
          fi
          echo "OK: раздел закрыт, открытого текста нет"
